[versions]
# Conferidas no Maven Central durante o desenvolvimento.
kotlin = "2.4.10"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
junit = "5.14.4"

# Estas vêm do Google Maven, inalcançável do ambiente onde o projeto foi escrito, e foram
# levantadas e confirmadas por builds de verdade no GitHub Actions.
#
# NÃO são as mais recentes publicadas, e isso é proposital: a partir de core 1.18 e
# lifecycle 2.10 o AndroidX passa a exigir AGP 9.1+, e o AGP 9 ainda não aceita o plugin
# kotlin-android 2.4.10. Enquanto essa ponta não se resolver, o teto do AndroidX é o que
# o AGP 8.13.2 aceita. Subir qualquer uma destas sem subir o AGP quebra o build.
#
# A versão do AGP não está aqui: ela vive no buildscript da raiz, que é onde precisa
# estar para o classloader bater com o do Kotlin. O AGP 9 exige Gradle 9 — mexeu numa,
# confira o wrapper junto.
androidxCore = "1.17.0"
# Única versão estável, e parada desde 2022: a API é pequena e não mudou.
splashScreen = "1.0.1"
activityCompose = "1.12.0"
lifecycle = "2.9.4"
navigationCompose = "2.9.5"
composeBom = "2026.06.01"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashScreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

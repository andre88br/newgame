name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Um push novo cancela o build anterior da mesma branch: economiza fila e evita baixar
# um APK que já está desatualizado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TEMPORÁRIO: o ambiente onde o app foi escrito não alcança o Google Maven, então as
  # versões do AndroidX foram escritas de memória. Este trabalho lista o que existe de
  # verdade, para fixá-las de uma vez em vez de tentar por tentativa e erro. Sai do fluxo
  # assim que o catálogo estiver correto.
  diagnostico:
    name: Versões disponíveis no Google Maven
    runs-on: ubuntu-latest
    steps:
      - name: Listar as versões estáveis mais recentes
        run: |
          for artefato in \
            "com/android/tools/build/gradle" \
            "androidx/compose/compose-bom" \
            "androidx/core/core-ktx" \
            "androidx/activity/activity-compose" \
            "androidx/lifecycle/lifecycle-viewmodel-compose" \
            "androidx/navigation/navigation-compose"; do
            echo "=== $artefato"
            curl -sS "https://dl.google.com/dl/android/maven2/$artefato/maven-metadata.xml" \
              | grep -oP '(?<=<version>)[^<]+' \
              | grep -vE 'alpha|beta|rc|dev' \
              | tail -6 | sed 's/^/    /'
          done
          echo "=== AGP instalado no runner / SDK"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -5

  motor:
    name: Testes do motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # As regras dos jogos não dependem de Android. Rodar sem o módulo :app mantém honesta
      # a promessa de que este teste funciona em qualquer máquina, com ou sem SDK.
      - name: Rodar os testes do core-game
        run: ./gradlew :core-game:test -Pnewgame.androidModule=false --no-daemon

      - name: Guardar o relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: core-game/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: APK de depuração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # O runner do GitHub já traz o SDK do Android instalado e as licenças aceitas, então
      # não é preciso instalar nada. É por isso que este fluxo existe: ele compila o módulo
      # Android, coisa que o ambiente onde o app foi escrito não conseguia fazer.
      - name: Compilar o APK
        run: ./gradlew :app:assembleDebug -Pnewgame.androidModule=true --no-daemon

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: newgame-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

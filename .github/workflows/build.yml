name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Um push novo cancela o build anterior da mesma branch: economiza fila e evita baixar
# um APK que já está desatualizado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TEMPORÁRIO. O Kotlin 2.4.10 não se aplica com AGP 8.13+ nem com AGP 9: o plugin
  # kotlin-android referencia BaseExtension/BaseVariant, classes que essas versões
  # removeram. Este trabalho varre as versões do AGP, da mais nova para a mais antiga, até
  # achar a primeira que configura o módulo — e, se nenhuma servir, tenta o caminho oposto,
  # um Kotlin mais novo com AGP 9. Sai do fluxo assim que a resposta estiver aplicada.
  combinacoes:
    name: Achar a combinação AGP/Gradle/Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Varrer as combinações
        run: |
          set +e
          META=https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml
          TODAS=$(curl -sS "$META" | grep -oP '(?<=<version>)[^<]+' | grep -vE 'alpha|beta|rc|dev')
          echo "AGP 8.x publicadas: $(echo "$TODAS" | grep -E '^8\.' | tr '\n' ' ')"
          echo

          testar() { # $1=agp  $2=gradle  $3=kotlin
            sed -i "s|^agp = .*|agp = \"$1\"|" gradle/libs.versions.toml
            sed -i "s|^kotlin = .*|kotlin = \"$3\"|" gradle/libs.versions.toml
            sed -i "s|gradle-[0-9.]*-bin.zip|gradle-$2-bin.zip|" gradle/wrapper/gradle-wrapper.properties
            ./gradlew :app:help -Pnewgame.androidModule=true --no-daemon \
              --no-configuration-cache -q > /tmp/saida 2>&1
            local r=$?
            if [ $r -eq 0 ]; then
              echo "OK     AGP $1 | Gradle $2 | Kotlin $3"
            else
              echo "falhou AGP $1 | Gradle $2 | Kotlin $3 :: $(grep -E '^ *> ' /tmp/saida | head -2 | tr -d '\n' | cut -c1-150)"
            fi
            git checkout -- gradle/libs.versions.toml gradle/wrapper/gradle-wrapper.properties
            return $r
          }

          for v in $(echo "$TODAS" | grep -E '^8\.' | tac | head -10); do
            testar "$v" 8.14.4 2.4.10 && {
              echo; echo "=== USAR: AGP $v + Gradle 8.14.4 + Kotlin 2.4.10"; exit 0; }
          done

          for k in 2.4.20-Beta2 2.4.20-Beta1; do
            testar 9.3.1 9.7.0 "$k" && {
              echo; echo "=== USAR: AGP 9.3.1 + Gradle 9.7.0 + Kotlin $k"; exit 0; }
          done

          echo; echo "=== nenhuma combinação testada configurou"

  motor:
    name: Testes do motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # As regras dos jogos não dependem de Android. Rodar sem o módulo :app mantém honesta
      # a promessa de que este teste funciona em qualquer máquina, com ou sem SDK.
      - name: Rodar os testes do core-game
        run: ./gradlew :core-game:test -Pnewgame.androidModule=false --no-daemon

      - name: Guardar o relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: core-game/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: APK de depuração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # O runner do GitHub já traz o SDK do Android instalado e as licenças aceitas, então
      # não é preciso instalar nada. É por isso que este fluxo existe: ele compila o módulo
      # Android, coisa que o ambiente onde o app foi escrito não conseguia fazer.
      - name: Compilar o APK
        run: ./gradlew :app:assembleDebug -Pnewgame.androidModule=true --no-daemon

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: newgame-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

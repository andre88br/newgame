name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Um push novo cancela o build anterior da mesma branch: economiza fila e evita baixar
# um APK que já está desatualizado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TEMPORÁRIO. Todas as versões do AGP falhavam com o mesmo NoClassDefFoundError, o que
  # revelou o problema real: AGP e Kotlin em classloaders separados. Corrigido isso, esta
  # varredura confirma qual versão do AGP configura de fato, começando pela mais nova. Sai
  # do fluxo assim que a resposta estiver aplicada.
  combinacoes:
    name: Confirmar a versão do AGP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Varrer
        run: |
          set +e
          testar() { # $1=agp  $2=gradle
            sed -i "s|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:$1|" build.gradle.kts
            sed -i "s|gradle-[0-9.]*-bin.zip|gradle-$2-bin.zip|" gradle/wrapper/gradle-wrapper.properties
            ./gradlew :app:help -Pnewgame.androidModule=true --no-daemon \
              --no-configuration-cache -q > /tmp/saida 2>&1
            local r=$?
            if [ $r -eq 0 ]; then
              echo "OK     AGP $1 | Gradle $2"
            else
              echo "falhou AGP $1 | Gradle $2 :: $(grep -E '^ *> ' /tmp/saida | head -2 | tr -d '\n' | cut -c1-170)"
            fi
            git checkout -- build.gradle.kts gradle/wrapper/gradle-wrapper.properties
            return $r
          }

          testar 9.3.1  9.7.0  && { echo; echo "=== USAR: AGP 9.3.1 + Gradle 9.7.0"; exit 0; }
          testar 9.0.0  9.7.0  && { echo; echo "=== USAR: AGP 9.0.0 + Gradle 9.7.0"; exit 0; }
          testar 8.13.2 8.14.4 && { echo; echo "=== USAR: AGP 8.13.2 + Gradle 8.14.4"; exit 0; }
          testar 8.12.3 8.14.4 && { echo; echo "=== USAR: AGP 8.12.3 + Gradle 8.14.4"; exit 0; }
          echo; echo "=== nenhuma configurou"

  motor:
    name: Testes do motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # As regras dos jogos não dependem de Android. Rodar sem o módulo :app mantém honesta
      # a promessa de que este teste funciona em qualquer máquina, com ou sem SDK.
      - name: Rodar os testes do core-game
        run: ./gradlew :core-game:test -Pnewgame.androidModule=false --no-daemon

      - name: Guardar o relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: core-game/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: APK de depuração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # O runner do GitHub já traz o SDK do Android instalado e as licenças aceitas, então
      # não é preciso instalar nada. É por isso que este fluxo existe: ele compila o módulo
      # Android, coisa que o ambiente onde o app foi escrito não conseguia fazer.
      - name: Compilar o APK
        run: ./gradlew :app:assembleDebug -Pnewgame.androidModule=true --no-daemon

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: newgame-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
